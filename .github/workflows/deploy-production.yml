name: Deploy PRODUCTION (user site)
# Builds source from cookiedoughdigital/cookiedoughdigital-site with production env.
# Manual only: run from Actions tab. Optional input = source ref (commit SHA/branch/tag).
on:
  workflow_dispatch:
    inputs:
      ref: { description: "Source ref in cookiedoughdigital-site", required: true, default: "main" }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.cookiedoughdigital.com
      BASE: /
      INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with: { repository: cookiedoughdigital/cookiedoughdigital-site, ref: "${{ inputs.ref }}" }
      - uses: withastro/action@v3
        with: { node-version: "22.23.4" }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
